<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="A student dashboard for schedule, deadlines, notes and grades."
    />
    <title>College Hub</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      // Keep the storage key in sync with src/store/useThemeStore.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('college-hub.theme') || 'null')
        var pref = (saved && saved.state && saved.state.theme) || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f5f5f7')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
