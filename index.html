<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="A student dashboard for schedule, deadlines, notes and grades."
    />
    <meta name="google-site-verification" content="yaUlITjyNKCvg8lJEBAjjDtIz_wzrc_GV_rVx1Yw2Ig" />
    <title>College Hub</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      // Keep the storage key in sync with src/store/useThemeStore.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('college-hub.theme') || 'null')
        var pref = (saved && saved.state && saved.state.theme) || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f5f5f7')
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      Static content for crawlers and no-JS visitors (including Google's OAuth homepage check).
      React replaces everything inside #root as soon as the app starts.
    -->
    <div id="root">
      <main style="max-width: 560px; margin: 0 auto; padding: 64px 20px; text-align: center">
        <h1 style="margin: 0; font-size: 28px; letter-spacing: -0.02em">College Hub</h1>
        <p style="color: var(--color-muted, #6e6e73)">
          A free student dashboard for class schedules, deadlines, notes and grades. Sign in with Google or continue
          without an account. Your data is saved in your own browser.
        </p>
        <p>
          <a href="privacy.html">Privacy Policy</a>
          &middot;
          <a href="terms.html">Terms of Service</a>
        </p>
        <noscript><p>College Hub needs JavaScript to run.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
